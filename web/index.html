<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Talgat AI 2.0</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><style>*{box-sizing:border-box}body{margin:0;background:#090f20;color:#e9f3ff;font:16px system-ui}main{max-width:850px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px 14px max(14px,env(safe-area-inset-bottom))}header{border-bottom:1px solid #35445e;padding:10px 0 20px}h1{font-size:24px;color:#81e8da;margin:0}small{color:#a8bbd6}#chat{flex:1;min-height:45vh;padding:14px 0}.bubble{background:#17253e;border-radius:17px;padding:14px 16px;margin:12px 0;line-height:1.6;overflow-wrap:anywhere}.user{background:#17524c;margin-left:16%}.assistant{margin-right:5%}pre{overflow:auto;background:#090f20;padding:12px;border-radius:8px}table{display:block;overflow:auto}td,th{border:1px solid #52647e;padding:6px}footer{position:sticky;bottom:0;background:#090f20;padding-top:10px}textarea{width:100%;min-height:76px;border:1px solid #48627e;border-radius:15px;background:#121f35;color:white;padding:13px;font:inherit}button{border:0;border-radius:12px;background:#75e6d1;color:#06221f;padding:12px;font-weight:700;min-height:45px}.secondary{background:#253a59;color:white}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.katex-display{overflow:auto}button:disabled{opacity:.5}</style></head><body><main><header><h1>✦ TALGAT AI 2.0</h1><small id="status">Проверка сервера…</small></header><section id="chat"><article class="bubble assistant">Здравствуйте! Я Talgat AI. Напишите ваш вопрос.</article></section><footer><textarea id="question" placeholder="Спросите что-нибудь…"></textarea><div class="buttons"><button id="send">Отправить</button><button id="voice" class="secondary">🔊 Голос: выкл.</button><button id="stop" class="secondary">Стоп</button></div></footer></main><script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script><script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script><script src="/app.js"></script></body></html>
