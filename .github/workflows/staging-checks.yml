name: Talgat AI staging checks
on:
  push:
    branches: [talgat-ai-2-staging]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          node --check netlify/functions/api.mjs
          node --check netlify/functions/transcribe.mjs
          node --check netlify/functions/speech.mjs
          node --check web/app.js
          node --check web/neural-voice.js
      - name: Test API and voice behavior
        run: npm test
      - name: Verify PWA files
        run: |
          test -s web/index.html
          test -s web/manifest.webmanifest
          test -s web/icon.svg
          node -e "JSON.parse(require('fs').readFileSync('web/manifest.webmanifest','utf8'))"
