name: Build Talgat AI Android APK
on:
  push:
    branches: [talgat-ai-2-staging]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'web/**'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Create Android wrapper
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          cat > capacitor.config.json <<'EOF'
          {"appId":"ai.talgat.mobile","appName":"Talgat AI 2.0","webDir":"web","server":{"androidScheme":"https"}}
          EOF
          npx cap add android
          npx cap sync android
      - name: Build installable debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Talgat-AI-2.0-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
