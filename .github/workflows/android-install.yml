name: Android installable app
on:
  push:
    branches: [talgat-ai-android-install]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-install-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build, unit tests and Android lint
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 10 emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            gradle --no-daemon connectedDebugAndroidTest
            mkdir -p android-proof
            adb pull /sdcard/Android/data/kz.talgat.nova/files/proof android-proof/
      - name: Verify APK signature and prepare download
        run: |
          mkdir -p android-dist
          cp app/build/outputs/apk/debug/app-debug.apk android-dist/Talgat-AI-2.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-dist/Talgat-AI-2.1.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-dist/Talgat-AI-2.1.0.apk > android-dist/apk-info.txt
          cd android-dist && sha256sum Talgat-AI-2.1.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Talgat-AI-2.1.0-Android
          path: android-dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-reports
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
            android-proof/
          retention-days: 14
