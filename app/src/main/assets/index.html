<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TALGAT AI NOVA</title><style>body{background:#081628;color:#d9faff;font:17px system-ui;padding:20px}h1{color:#69edfb}textarea,input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #3a7b94;background:#102c42;color:white}button{background:#116b86}pre{white-space:pre-wrap}</style><h1>TALGAT AI NOVA</h1><p>Автономный базовый режим. Облачный интеллект пока не подключён.</p><textarea id="q" rows="4" placeholder="Введите запрос или арифметическое выражение"></textarea><button onclick="go()">Ответить</button><pre id="out"></pre><h3>Локальные заметки</h3><textarea id="notes" rows="5"></textarea><button onclick="localStorage.setItem('nova_notes',document.getElementById('notes').value);alert('Сохранено')">Сохранить заметки</button><script>document.getElementById("notes").value=localStorage.getItem("nova_notes")||"";function go(){let q=document.getElementById("q").value.trim(),o=document.getElementById("out");if(!q)return;let s=q.replace(/^посчитай\s*:?\s*/i,"");if(/^[\d\s+*/().%-]+$/.test(s)){try{let v=Function("return ("+s+")")();o.textContent=Number.isFinite(v)?String(v):"Ошибка вычисления";return}catch(e){}}o.textContent="Для сложных запросов необходимо подключить языковую модель. Сейчас доступны локальные заметки и базовые вычисления."}</script></html>
